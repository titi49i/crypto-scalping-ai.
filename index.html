

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Scalping AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#090e18;color:#edf3ff;font-family:Arial}
h1{color:#55d6a3;font-size:23px}
.card{background:#141f30;border:1px solid #30415a;border-radius:12px;padding:14px;margin:12px 0}
button{background:#176b50;color:white;border:0;border-radius:9px;padding:12px;font-weight:bold}
small{color:#9aabc2}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #30415a}
th{color:#9aabc2}
.scroll{overflow-x:auto}
.green{color:#55d6a3}.red{color:#ff8585}.yellow{color:#ffd477}
</style>
</head>
<body>
<h1>⚡ CRYPTO SCALPING AI</h1>
<p><small>BINANCE • SPOT + FUTURES • LONG ONLY</small></p>
<button onclick="start()">ACTUALISER LES MARCHÉS</button>

<div class="card">
<b>Scanner</b>
<p id="status" class="yellow">Connexion en attente...</p>
<small>Signaux indicatifs. Aucun ordre automatique.</small>
</div>

<div class="card">
<b>Opportunités LONG</b>
<div class="scroll">
<table>
<thead><tr><th>Marché</th><th>Paire</th><th>Prix</th><th>Signal</th></tr></thead>
<tbody id="signals"><tr><td colspan="4">En attente...</td></tr></tbody>
</table>
</div>
</div>

<div class="card">
<b>Top 100 altcoins Spot USDT</b>
<div class="scroll">
<table>
<thead><tr><th>#</th><th>Paire</th><th>Prix</th><th>Volume 24h</th></tr></thead>
<tbody id="coins"></tbody>
</table>
</div>
</div>

<script>
const stable=["USDC","FDUSD","USDP","TUSD","DAI","USDE","USDS","BUSD"];
const excluded=["UP","DOWN","BULL","BEAR","2L","2S","3L","3S"];

const fmt=n=>Number(n).toLocaleString("fr-FR",{maximumFractionDigits:6});

async function get(url){
 const r=await fetch(url);
 if(!r.ok)throw Error("Binance HTTP "+r.status);
 return r.json();
}

function ema(a,p){
 let k=2/(p+1),v=a[0];
 for(let i=1;i<a.length;i++)v=a[i]*k+v*(1-k);
 return v;
}

function rsi(a){
 let g=0,l=0;
 for(let i=a.length-15;i<a.length-1;i++){
  let d=a[i+1]-a[i];
  if(d>0)g+=d;
  else l-=d;
 }
 return l===0?100:100-100/(1+g/l);
}

async function test(symbol,market,coin){
 try{
  let base=market==="SPOT"
   ?"https://api.binance.com"
   :"https://fapi.binance.com";

  let path=market==="SPOT"
   ?"/api/v3/klines"
   :"/fapi/v1/klines";

  let frames=await Promise.all(
   ["1m","5m","15m"].map(tf=>
    get(base+path+"?symbol="+symbol+"&interval="+tf+"&limit=35")
   )
  );

  let closes=frames.map(k=>
   k.slice(0,-1).map(x=>Number(x[4]))
  );

  let a=closes[0],b=closes[1],c=closes[2];

  let ok=a.length>=25&&
   a.at(-1)>a.at(-2)&&
   ema(b.slice(-30),9)>ema(b.slice(-30),21)&&
   ema(c.slice(-30),9)>ema(c.slice(-30),21)&&
   rsi(b)>=50&&rsi(b)<=70;

  return ok?{
   market,
   symbol,
   price:coin.lastPrice
  }:null;

 }catch(e){
  return null;
 }
}

async function start(){
 let status=document.getElementById("status");
 let output=document.getElementById("signals");

 status.textContent="Récupération des marchés Binance...";
 output.innerHTML="<tr><td colspan='4'>Analyse en cours...</td></tr>";

 try{
  let [spot,futures]=await Promise.all([
   get("https://api.binance.com/api/v3/ticker/24hr"),
   get("https://fapi.binance.com/fapi/v1/ticker/24hr")
  ]);

  function clean(data){
   return data.filter(x=>
    x.symbol.endsWith("USDT")&&
    !stable.some(s=>x.symbol===s+"USDT")&&
    !excluded.some(s=>x.symbol.startsWith(s))&&
    Number(x.quoteVolume)>0
   )
   .sort((a,b)=>
    Number(b.quoteVolume)-Number(a.quoteVolume)
   )
   .slice(0,100);
  }

  let s=clean(spot);
  let f=clean(futures);

  document.getElementById("coins").innerHTML=
   s.map((x,i)=>
    `<tr>
     <td>${i+1}</td>
     <td>${x.symbol}</td>
     <td>${fmt(x.lastPrice)}</td>
     <td>${fmt(Number(x.quoteVolume)/1e6)} M$</td>
    </tr>`
   ).join("");

  status.textContent=
   "Top 100 chargé. Analyse des 10 premières paires de chaque marché...";

  let found=[];

  for(let market of [
   {name:"SPOT",data:s},
   {name:"FUTURES",data:f}
  ]){
   for(let coin of market.data.slice(0,10)){
    let result=await test(coin.symbol,market.name,coin);
    if(result)found.push(result);
   }
  }

  document.getElementById("signals").innerHTML=
   found.length?
   found.map(x=>
    `<tr>
     <td>${x.market}</td>
     <td>${x.symbol}</td>
     <td>${fmt(x.price)}</td>
     <td class="green">LONG</td>
    </tr>`
   ).join("")
   :
   "<tr><td colspan='4' class='yellow'>NO TRADE — aucun signal confirmé</td></tr>";

  status.textContent=
   "Scan terminé : "+new Date().toLocaleTimeString("fr-FR");

 }catch(e){
  status.textContent="Erreur de connexion : "+e.message;
  output.innerHTML=
   "<tr><td colspan='4'>Réessaie plus tard.</td></tr>";
 }
}

start();
</script>
</body>
</html>
